name: Build, attest, scan, and promote

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/containersecurity-dev/sip
  TRIVY_VERSION: 0.72.0

jobs:
  dependencies:
    name: SIP ii - dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Reject ineligible release refs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = branch ] && [ "$REF_NAME" = main ]; then
            exit 0
          fi
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v* ]]; then
            exit 0
          fi
          echo "Ref ${REF_TYPE}:${REF_NAME} is not eligible for release" >&2
          exit 1

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Validate dependencies and build
        run: |
          node scripts/validate-lockfile-age.mjs
          npm exec --yes --package=npm@11.10.0 -- npm ci --ignore-scripts
          npm run build
          npm test

  container-attestations:
    name: SIP iii-iv - container and attestations
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push candidate with attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }}:sha-${{ env.CANDIDATE_SHA }},push=true,oci-mediatypes=true,oci-artifact=true

      - name: Record immutable candidate reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Attested candidate"
            echo '```text'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vulnerabilities:
    name: SIP v - attached SBOM CVEs
    needs: container-attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      DIGEST: ${{ needs.container-attestations.outputs.digest }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: true

      - name: Retrieve and validate attached OCI SBOM
        run: |
          test -n "$DIGEST"
          docker buildx imagetools inspect \
            "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json
          jq -e \
            '.spdxVersion and (.packages | type == "array") and (.packages | length > 0)' \
            sbom.spdx.json > /dev/null

      - name: Scan attached SBOM
        id: scan
        run: |
          trivy sbom \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output trivy.json \
            sbom.spdx.json
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "critical-count=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Comment PR results
        if: github.event_name == 'pull_request'
        env:
          CRITICAL_COUNT: ${{ steps.scan.outputs.critical-count }}
        run: |
          {
            echo '<!-- sip-trivy-report -->'
            echo '## SIP vulnerability report'
            echo
            echo "Scanned attached SBOM for \`${IMAGE}@${DIGEST}\`."
            echo
            echo "Fixable Critical vulnerabilities: **${CRITICAL_COUNT}**"
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo
              echo '| Package | Vulnerability | Installed | Fixed |'
              echo '| --- | --- | --- | --- |'
              jq -r '
                [.Results[]?.Vulnerabilities[]?][:20][] |
                "| `\(.PkgName)` | `\(.VulnerabilityID)` | `\(.InstalledVersion)` | `\(.FixedVersion)` |"
              ' trivy.json
            fi
          } > comment.md

          jq -n --rawfile body comment.md '{body: $body}' > comment.json
          COMMENT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- sip-trivy-report -->")) | .id' \
            | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input comment.json > /dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input comment.json > /dev/null
          fi

          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Critical CVE gate
        env:
          CRITICAL_COUNT: ${{ steps.scan.outputs.critical-count }}
        run: test "$CRITICAL_COUNT" -eq 0

  promotion:
    name: Release - promote scanned digest
    if: github.event_name != 'pull_request'
    needs: [container-attestations, vulnerabilities]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      DIGEST: ${{ needs.container-attestations.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Select promotion tag
        id: promotion
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote the scanned digest
        env:
          PROMOTION_TAG: ${{ steps.promotion.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${PROMOTION_TAG}" \
            "${IMAGE}@${DIGEST}"
